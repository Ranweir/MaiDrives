
name: Build Mai Shiranui Drive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f \
            \( -iname 'Mai-Shiranui-Drive-GitHub-Build*.zip' \
            -o -iname 'Mai-Shiranui-Drive-GitHub-Build' \) \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PACKAGE_JSON=$(find extracted -type f \
            -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json missing"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_JSON")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          test -d "$APP_DIR/android"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build Web Assets
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Platform
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mai-Shiranui-Drive-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
