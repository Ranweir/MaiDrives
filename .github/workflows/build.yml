
name: Build APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          if [ ! -f "source.zip" ]; then
            echo "::error::source.zip not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -q source.zip -d extracted

          PACKAGE_JSON=$(find extracted -type f -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json not found inside ZIP"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_JSON")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $APP_DIR"

          test -d "$APP_DIR/android"
          test -f "$APP_DIR/capacitor.config.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm ci

      - name: Build Web Game
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mai-Shiranui-Drive-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
